name: X自動投稿

on:
  schedule:
    - cron: "30 22 * * *"  # JST 07:30
    - cron: "0 0 * * *"    # JST 09:00
    - cron: "30 1 * * *"   # JST 10:30
    - cron: "0 3 * * *"    # JST 12:00
    - cron: "30 4 * * *"   # JST 13:30
    - cron: "0 6 * * *"    # JST 15:00
    - cron: "0 8 * * *"    # JST 17:00
    - cron: "0 10 * * *"   # JST 19:00
    - cron: "30 11 * * *"  # JST 20:30
    - cron: "0 13 * * *"   # JST 22:00
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Pythonをセットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 必要なライブラリをインストール
        run: pip install tweepy

      - name: 投稿を実行
        env:
          X_API_KEY: ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET: ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN: ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET: ${{ secrets.X_ACCESS_TOKEN_SECRET }}
        run: python scripts/post_to_x.py

      - name: 投稿ログをコミット
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/posted_log.json
          git diff --cached --quiet || git commit -m "投稿ログを更新"
          git push
